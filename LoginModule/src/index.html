<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>LoginModule — Secure User Management</title>
  <base href="/">

  <!-- Viewport & theme -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffb74d">

  <!-- SEO -->
  <meta name="description" content="Secure user management portal with role-based access control, built with Angular and Spring Boot.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Open Graph (social sharing) -->
  <meta property="og:title" content="LoginModule — Secure User Management">
  <meta property="og:description" content="Secure user management portal with role-based access control.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Preconnect to external origins to reduce DNS + TLS handshake time -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Bootstrap CSS (render-critical — keep in <head>) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Google Fonts — display=swap avoids FOIT -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
</head>

<body class="mat-typography">
  <app-root></app-root>

  <noscript>Please enable JavaScript to continue using this application.</noscript>

  <!-- Bootstrap JS — deferred so it never blocks rendering -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous" defer></script>
</body>

</html>
